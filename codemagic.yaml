
workflows:
  pixrewards-apk:
    name: PixRewards APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.19.6
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > $CM_BUILD_DIR/android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> $CM_BUILD_DIR/android/local.properties
          echo "flutter.versionCode=1" >> $CM_BUILD_DIR/android/local.properties
          echo "flutter.versionName=1.0.0" >> $CM_BUILD_DIR/android/local.properties
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK (debug, sem assinatura)
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
